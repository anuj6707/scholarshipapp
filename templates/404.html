{% extends "base.html" %}

{% block title %}Page Not Found | {{ app_name }}{% endblock %}

{% block content %}
<div class="container section-py" style="text-align: center; max-width: 600px;">
  <div style="font-size: 4.5rem; font-weight: 800; color: var(--primary-600); margin-bottom: 1rem;">404</div>
  <h1 style="font-size: 1.75rem; margin-bottom: 0.75rem;">Scholarship or Page Not Found</h1>
  <p style="color: var(--slate-600); margin-bottom: 2rem;">
    The scholarship or page you are searching for does not exist or may have been updated.
  </p>
  <div style="display: flex; justify-content: center; gap: 1rem;">
    <a href="{{ url_for('index') }}" class="btn btn-primary">Return to Home</a>
    <a href="{{ url_for('scholarships_list') }}" class="btn btn-secondary">Browse All Scholarships</a>
  </div>
</div>
{% endblock %}
