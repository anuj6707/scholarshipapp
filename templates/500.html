{% extends "base.html" %}

{% block title %}Server Error | ScholarMatch{% endblock %}

{% block content %}
<div class="container section-py" style="text-align: center; max-width: 600px;">
  <div style="font-size: 4.5rem; font-weight: 800; color: var(--rose-500); margin-bottom: 1rem;">500</div>
  <h1 style="font-size: 1.75rem; margin-bottom: 0.75rem;">Internal Server Error</h1>
  <p style="color: var(--slate-600); margin-bottom: 2rem;">
    Something unexpected happened on our server. Please try again or start a fresh session.
  </p>
  <div style="display: flex; justify-content: center; gap: 1rem;">
    <a href="{{ url_for('index') }}" class="btn btn-primary">Return to Home</a>
    <a href="{{ url_for('questionnaire') }}" class="btn btn-secondary">Try Questionnaire Again</a>
  </div>
</div>
{% endblock %}
